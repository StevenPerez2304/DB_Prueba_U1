<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registrar Venta</title>

    <style>

        body{
            background:#eef2f7;
            font-family:Arial, Helvetica, sans-serif;
        }

        .contenedor{

            width:550px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 15px rgba(0,0,0,.2);

        }

        h2{

            text-align:center;
            color:#2c3e50;

        }

        label{

            font-weight:bold;

        }

        select,input{

            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border-radius:5px;
            border:1px solid #ccc;

        }

        button{

            width:100%;
            padding:12px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;

        }

        button:hover{

            background:#2980b9;

        }

    </style>

</head>

<body>

<div class="contenedor">

    <h2>Registrar Venta</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Cliente</label>

        <select name="id_cliente" required>

            {% for c in clientes %}

            <option value="{{ c.id_cliente }}">

                {{ c.nombre }}

            </option>

            {% endfor %}

        </select>


        <label>Empleado</label>

        <select name="id_empleado" required>

            {% for e in empleados %}

            <option value="{{ e.id_empleado }}">

                {{ e.nombre_completo }} {{ e.apellido_completo }}

            </option>

            {% endfor %}

        </select>


        <label>Producto</label>

        <select name="id_producto" required>

            {% for p in productos %}

            <option value="{{ p.id_producto }}">

                {{ p.marca }} - {{ p.modelo }}

            </option>

            {% endfor %}

        </select>


        <label>Proveedor</label>

        <select name="id_proveedor">

            {% for pr in proveedores %}

            <option value="{{ pr.id_proveedor }}">

                {{ pr.nombre_empresa }}

            </option>

            {% endfor %}

        </select>


        <label>Cantidad</label>

        <input
                type="number"
                name="cantidad"
                required>


        <label>Precio Unitario</label>

        <input
                type="number"
                step="0.01"
                name="precio_unitario"
                required>


        <label>Fecha</label>

        <input
                type="date"
                name="fecha"
                required>


        <button type="submit">

            Registrar Venta

        </button>

    </form>

</div>

</body>

</html>
