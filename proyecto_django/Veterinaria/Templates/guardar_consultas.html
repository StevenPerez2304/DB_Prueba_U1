<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar Consulta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            background: white;
            width: 500px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .grupo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Guardar Consulta</h1>

    <form method="post">
        {% csrf_token %}

        <div class="grupo">
            <label for="propietario">Propietario</label>
            <select name="id_veterinario" id="id_veterinario" class="form-select"
                    required>
                <option value="">
                    Seleccione un propietario
                </option>

                {% for v in veterinarios %}
                <option value="{{ v.id_veterinario }}">
                    {{ v.nombres }}
                    {{ v.apellidos }}
                </option>
                {% endfor %}
            </select>
        </div>

        <label for="id_mascota">Mascota:</label>
        <select name="id_mascota" id="id_mascota" class="form-select" required>
            <option value="">Seleccione una mascota</option>

            {% for m in mascotas %}
            <option value="{{ m.id }}">
                {{ m.nombre }} - {{ m.raza }}
            </option>
            {% endfor %}
        </select>

        <div class="grupo">
            <label for="numero_consultas">Número de Consulta</label>
            <input type="number" id="numero_consultas" name="numero_consultas">
        </div>

        <div class="grupo">
            <label for="diagnostico">Diagnóstico</label>
            <textarea id="diagnostico" name="diagnostico"></textarea>
        </div>

        <div class="grupo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha">
        </div>

        <button type="submit">
            Guardar Consulta
        </button>
    </form>
</div>

</body>
</html>
